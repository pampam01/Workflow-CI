name: Run ML Training
on:
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run training (mlflow no-conda or fallback)
        run: |
          # Prioritaskan folder MLProject bila ada (case-sensitive)
          if [ -d "MLProject" ]; then
            echo "Found MLProject directory — running mlflow run MLProject --no-conda"
            mlflow run MLProject --no-conda
            exit $?
          fi

          # Bila ada file MLproject di root (MLproject / MLProject file), jalankan mlflow run . --no-conda
          if [ -f "MLproject" ] || [ -f "MLproject.yaml" ] || [ -f "MLproject.yml" ]; then
            echo "Found MLproject file in repo root — running mlflow run . --no-conda"
            mlflow run . --no-conda
            exit $?
          fi

          # Jika ada modelling.py di root, jalankan langsung
          if [ -f "modelling.py" ]; then
            echo "Found modelling.py in repo root — running python modelling.py"
            python modelling.py
            exit $?
          fi

          # Cari modelling.py di seluruh repo dan jalankan file pertama yang ditemukan
          script=$(find . -type f -name "modelling.py" | sed -n '1p' || true)
          if [ -n "$script" ]; then
            echo "Found modelling.py at $script — running python $script"
            python "$script"
            exit $?
          fi

          echo "ERROR: Tidak menemukan MLProject/MLproject atau modelling.py. Pastikan file ada di repo."
          exit 1
