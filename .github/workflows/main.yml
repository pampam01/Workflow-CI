name: Run ML Training
on:
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run training (mlflow no-conda or direct script)
        run: |
          # Jika repo adalah MLflow Project, jalankan tanpa conda agar tidak mencoba `source activate`
          if [ -f MLproject ]; then
            mlflow run . --no-conda
          else
            # fallback: langsung jalankan script (pastikan modelling.py ada)
            python modelling.py
          fi
