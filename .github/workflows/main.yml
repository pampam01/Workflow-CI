name: Run ML Training
on:
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run training (direct script inside MLProject)
        run: |
          # Jika folder MLProject ada, jalankan modelling.py di dalamnya
          if [ -d "MLProject" ]; then
            echo "Running MLProject/modelling.py directly"
            python MLProject/modelling.py
            exit $?
          fi

          # fallback: cari file modelling.py di repo
          script=$(find . -type f -name "modelling.py" | sed -n '1p' || true)
          if [ -n "$script" ]; then
            echo "Found modelling.py at $script — running python $script"
            python "$script"
            exit $?
          fi

          echo "ERROR: Tidak menemukan MLProject/modelling.py atau modelling.py di repo."
          exit 1
