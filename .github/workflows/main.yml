name: Run ML Training

on:
  push:
    branches: [ main ]

jobs:
  train-model:
    runs-on: ubuntu-latest
    steps:
      # Langkah 1: Mengunduh kode dari repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Langkah 2: Menyiapkan Python (Kita tidak butuh Conda lagi dengan --no-conda)
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13' # Sesuaikan jika perlu

      # Langkah 3: Menginstall Dependencies (termasuk MLflow)
      # Pastikan semua library dari conda.yaml ada di sini
      - name: Install dependencies
        run: pip install mlflow pandas scikit-learn matplotlib seaborn

      # Langkah 4: Menjalankan proses training menggunakan MLflow tanpa membuat env baru
      - name: Run MLflow Project (without Conda env creation)
        shell: bash 
        working-directory: ./MLProject 
        run: mlflow run . --no-conda
