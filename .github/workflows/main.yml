name: Run ML Training
on:
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow
          # jika ada requirements di root atau di MLProject, install
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f MLProject/requirements.txt ]; then pip install -r MLProject/requirements.txt; fi

      - name: Debug workspace (optional)
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "PWD=$(pwd)"
          echo "Top-level repo listing:"
          ls -la || true
          echo "MLProject listing (if exists):"
          ls -la MLProject || true

      - name: Find and run modelling.py
        run: |
          # Prefer MLProject/modelling.py
          if [ -f "./MLProject/modelling.py" ]; then
            echo "Running MLProject/modelling.py"
            python ./MLProject/modelling.py
            exit $?
          fi

          # Otherwise find first matching modelling.py anywhere in repo
          script=$(find . -type f -name "modelling.py" -print -quit || true)
          if [ -n "$script" ]; then
            echo "Found modelling.py at: $script"
            python "$script"
            exit $?
          fi

          echo "ERROR: modelling.py not found. Expected at MLProject/modelling.py or elsewhere in repo."
          exit 1
