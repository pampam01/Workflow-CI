name: Run ML Training

on:
  push:
    branches: [ main ]

jobs:
  train-model:
    runs-on: ubuntu-latest
    steps:
      # Langkah 1: Mengunduh kode dari repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Langkah 2: Menyiapkan Conda Environment
      # Action ini akan mengurus inisialisasi shell untuk conda
      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v2
        with:
          auto-activate-base: false
          # Pastikan versi python ini sesuai dengan yang ada di conda.yaml Anda
          python-version: '3.13' 

      # Langkah 3: Menginstall MLflow
      - name: Install MLflow
        run: pip install mlflow

      # Langkah 4: Menjalankan proses training menggunakan MLflow
      - name: Run MLflow Project
        # Menggunakan shell yang sudah diinisialisasi Conda
        shell: bash
        # Pindah ke folder MLProject sebelum menjalankan perintah
        working-directory: ./MLProject 
        # Jalankan MLflow dari dalam folder MLProject
        run: mlflow run .
